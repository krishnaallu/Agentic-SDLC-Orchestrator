spring.application.name=AgenticOrchestrator
spring.profiles.default=local
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/orchestrator}
spring.datasource.username=${DATABASE_USERNAME:orchestrator}
spring.datasource.password=${DATABASE_PASSWORD:orchestrator}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
orchestrator.agent.provider=${ORCHESTRATOR_AGENT_PROVIDER:template}
orchestrator.agent.base-url=${ORCHESTRATOR_AGENT_BASE_URL:https://api.openai.com/v1}
orchestrator.agent.api-key=${ORCHESTRATOR_AGENT_API_KEY:}
orchestrator.agent.model=${ORCHESTRATOR_AGENT_MODEL:gpt-4.1-mini}
orchestrator.api.requests-per-minute=${API_REQUESTS_PER_MINUTE:120}
orchestrator.api.maximum-tracked-clients=${API_MAXIMUM_TRACKED_CLIENTS:10000}
orchestrator.api.maximum-request-bytes=${API_MAXIMUM_REQUEST_BYTES:262144}
orchestrator.temporal.target=${TEMPORAL_TARGET:localhost:7233}
orchestrator.temporal.task-queue=${TEMPORAL_TASK_QUEUE:engineering-orchestrator}
